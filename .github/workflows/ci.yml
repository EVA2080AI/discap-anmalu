name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build (con env de mentira — solo verificación de tipos y compilación)
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DATABASE_URL_UNPOOLED: "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-only-secret-not-used-in-runtime"
